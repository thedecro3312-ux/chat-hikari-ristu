name: Copy uploaded file to index

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Copy file to index.html
        run: |
          cp P_gina_de_chat_online-8cd54c6a.html index.html
          rm P_gina_de_chat_online-8cd54c6a.html
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html P_gina_de_chat_online-8cd54c6a.html
          git commit -m "Replace index.html with corrected chat page" || exit 0
          git push
